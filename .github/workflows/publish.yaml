name: Publish packages to npm

on:
  push:
    branches:
      - master

# Prevent concurrent publishes
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    # Only run if the commit was made by nx release (version bump commit)
    # This prevents publishing on every push to master
    if: contains(github.event.head_commit.message, 'chore(release)')

    permissions:
      contents: read
      id-token: write # needed for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for Nx

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all publishable libraries
        run: pnpm nx run-many -t build --projects=tag:publishable

      - name: Publish packages
        run: pnpm nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
