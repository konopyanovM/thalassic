<input
  [class]="controlClasses()"
  [type]="type()"
  [attr.id]="inputId()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [value]="value()"
  (input)="onInput($event)"
>
<button class="tls-password-toggle tls-form-control-addon" (click)="toggle()">
  <span class="tls-password-toggle__item" [class.tls-password-toggle__item--hidden]="visible()">
    <span class="text-label-md">Show</span>
    </span>
  <span class="tls-password-toggle__item" [class.tls-password-toggle__item--hidden]="!visible()">
    <span class="text-label-md">Hide</span>
  </span>
</button>
