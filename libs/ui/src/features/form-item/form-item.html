<div class="form-item-main">
  @if (hasLabel() || reserveLabelSpace()) {
    <label class="form-item-label" [id]="labelId" [attr.for]="labelFor()">
      @if (labelTemplate(); as template) {
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="labelContext()" />
      } @else {
        <span class="form-item-label__text">{{ label() }}</span>
        @if (showRequired()) {
          <span class="form-item-label__required">*</span>
        } @else if (showOptional()) {
          <span class="form-item-label__optional">{{ optionalText() }}</span>
        }
      }
    </label>
  }
  <div class="form-item-control">
    <ng-content></ng-content>
  </div>
</div>
@if (displayErrors()) {
  <small class="form-item-error">
    @if (isInvalid()) {
      <span class="form-item-error__text" [id]="errorId">
      {{ firstErrorMessage() }}
    </span>
    }
  </small>
}
