@if (label() || reserveLabelSpace()) {
  <label class="form-item-label" [id]="labelId">
    <span class="form-item-label__text">{{ label() }}</span>
    @if (showRequired()) {
      <span class="form-item-label__required">*</span>
    } @else if (showOptional()) {
      <span class="form-item-label__optional">{{ optionalText() }}</span>
    }
  </label>
}
<div class="form-item-control">
  <ng-content></ng-content>
</div>
@if (displayErrors()) {
  <small class="form-item-error">
    @if (isInvalid()) {
      <span class="form-item-error__text" [id]="errorId">
      {{ firstErrorMessage() }}
    </span>
    }
  </small>
}
