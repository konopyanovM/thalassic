<input
  type="checkbox"
  class="tls-checkbox-input"
  [id]="inputId()"
  [name]="name()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [checked]="checked()"
  (click)="toggle()"
  (blur)="touched.set(true)"
  (keydown.space)="onKeyboardToggle($event)"
  (keydown.enter)="onKeyboardToggle($event)"
/>
<div class="tls-checkbox-icon">
  @if (indeterminate()) {
  <svg
    xmlns="http://www.w3.org/2000/svg"
    height="20px"
    viewBox="0 -960 960 960"
    width="20px"
    fill="currentColor"
  >
    <path d="M288-444v-72h384v72H288Z" />
  </svg>
  } @else {
  <svg
    xmlns="http://www.w3.org/2000/svg"
    height="20px"
    viewBox="0 -960 960 960"
    width="20px"
    fill="currentColor"
  >
    <path d="M400-301 240-461l51-51 109 109 269-269 51 51-320 320Z" />
  </svg>
  }
</div>
