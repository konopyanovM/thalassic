<!-- No aria-required here: a radio is one option, and whether the question must be answered is
     stated on its radiogroup, the only one of the two roles that supports it. -->
<input
  type="radio"
  class="tls-radio-button-input"
  [attr.id]="effectiveInputId()"
  [name]="name()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  [tabindex]="tabindex()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [checked]="checked()"
  [value]="radioValue()"
  (change)="check()"
  (blur)="touched.set(true)"
/>
<div class="tls-radio-button-circle"></div>
