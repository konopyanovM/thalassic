<button
  type="button"
  class="tls-picker-field__trigger"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-haspopup]="popup.kind"
  [attr.aria-expanded]="popup.expanded()"
  [attr.aria-controls]="popup.id()"
>
  <span class="tls-picker-field__value">
    <ng-content />
  </span>
  <tls-icon class="tls-picker-field__chevron" name="chevron-down" aria-hidden="true" />
</button>
