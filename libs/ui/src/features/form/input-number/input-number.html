<!-- Text rather than `type="number"`: the field reads the number itself (see
     the component's documentation). `autocorrect` and `spellcheck` are off so
     the keyboard never rewrites a figure as a word. -->
<input
  type="text"
  autocorrect="off"
  spellcheck="false"
  [name]="name()"
  [class]="classes()"
  [attr.id]="effectiveInputId()"
  [attr.inputmode]="effectiveInputMode()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-busy]="pending() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [value]="text()"
  (beforeinput)="onBeforeInput($event)"
  (input)="onInput($event)"
  (change)="onChange()"
  (keydown)="onKeydown($event)"
  (blur)="touched.set(true)"
/>
@if (pending()) {
  <tls-loader class="tls-form-control__spinner" size="xs" aria-hidden="true" />
}
