<!--
  The listbox cannot live on the host: its selection model is an array of
  option values, so the directive's bindings have to pass through the
  adapting computeds/handlers below, which host directives cannot do.
-->
<div
  ngListbox
  class="tls-color-swatch-picker__list"
  orientation="horizontal"
  selectionMode="explicit"
  [value]="selectedValues()"
  (valueChange)="onSelectionChange($event)"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [attr.aria-label]="label()"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
>
  @for (option of normalizedOptions(); track option.value) {
    <!--
      The swatch is a picture of the color and nothing else, so the option
      carries the name: without it a color is announced as whatever notation it
      happens to be written in.
    -->
    <div
      ngOption
      class="tls-color-swatch-picker__option"
      [value]="option.value"
      [label]="option.label"
      [disabled]="option.disabled"
      [attr.aria-label]="option.label"
    >
      <tls-color-swatch [value]="color(option)" [size]="size()" aria-hidden="true" />
    </div>
  }
</div>
