<input
  #trigger
  type="text"
  class="tls-autocomplete__trigger"
  role="combobox"
  autocomplete="off"
  [attr.id]="effectiveInputId()"
  [attr.name]="name()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-busy]="pending() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  aria-haspopup="listbox"
  aria-autocomplete="list"
  [attr.aria-controls]="isOpen() ? listboxId : null"
  [attr.aria-activedescendant]="activeDescendantId()"
  [attr.aria-expanded]="isOpen()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readonly]="readonly()"
  [tabindex]="disabled() ? -1 : tabindex()"
  [value]="query()"
  (input)="onInput($event)"
  (click)="open()"
  (blur)="touched.set(true)"
  (keydown)="onKeydown($event)"
/>
@if (clearable() && hasValue()) {
  <button
    type="button"
    class="tls-autocomplete__clear"
    tabindex="-1"
    [attr.aria-label]="clearLabel()"
    (click)="clear()"
  >
    <tls-icon class="tls-autocomplete__clear-icon" name="close" aria-hidden="true" />
  </button>
}
@if (pending()) {
  <tls-loader class="tls-autocomplete__spinner" size="xs" aria-hidden="true" />
}

<ng-template #panel>
  <ul
    class="tls-autocomplete__panel"
    animate.enter="tls-autocomplete__panel--enter"
    animate.leave="tls-autocomplete__panel--leave"
    role="listbox"
    [id]="listboxId"
  >
    @for (option of visibleOptions(); track option.value; let index = $index) {
      <li
        class="tls-autocomplete__option"
        [class.tls-autocomplete__option--selected]="option.value === value()"
        [class.tls-autocomplete__option--active]="index === activeIndex()"
        [class.tls-autocomplete__option--disabled]="option.disabled"
      >
        <button
          class="tls-autocomplete__option-button"
          role="option"
          [id]="optionId(index)"
          [disabled]="option.disabled"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="option.disabled"
          (click)="select(option)"
          (pointerenter)="onOptionHover($event, index, option.disabled)"
        >{{ option.label }}
        </button>
      </li>
    } @empty {
      <li class="tls-autocomplete__empty" role="presentation">{{ emptyMessage() }}</li>
    }
  </ul>
</ng-template>
