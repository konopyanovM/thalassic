<button
  #trigger
  type="button"
  class="tls-select__trigger"
  role="combobox"
  [attr.id]="effectiveInputId()"
  [attr.name]="name()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-busy]="pending() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  aria-haspopup="listbox"
  [attr.aria-controls]="isOpen() ? listboxId : null"
  [attr.aria-activedescendant]="activeDescendantId()"
  [tabindex]="disabled() ? -1 : tabindex()"
  [disabled]="disabled()"
  [attr.aria-expanded]="isOpen()"
  (click)="toggle()"
  (blur)="touched.set(true)"
  (keydown)="onKeydown($event)"
>
  <span class="tls-select__value" [class.tls-form-control__placeholder]="!selectedLabel()">
    {{ selectedLabel() || placeholder() }}
  </span>
  <div class="tls-select__icon" aria-hidden="true" [class.tls-select__icon--hidden]="pending()">
    <tls-icon class="tls-select__chevron" name="chevron-down" aria-hidden="true" />
  </div>
</button>
@if (clearable() && hasValue()) {
  <button
    type="button"
    class="tls-select__clear"
    tabindex="-1"
    [attr.aria-label]="clearLabel()"
    (click)="clear()"
  >
    <tls-icon class="tls-select__clear-icon" name="close" aria-hidden="true" />
  </button>
}
@if (pending()) {
  <tls-loader class="tls-select__spinner" size="xs" aria-hidden="true" />
}

<ng-template #panel>
  <ng-template #optionButton let-option let-index="index" let-setsize="setsize">
    <button
      class="tls-select__option-button"
      role="option"
      [id]="optionId(index)"
      [disabled]="option.disabled"
      [attr.aria-selected]="option.value === value()"
      [attr.aria-disabled]="option.disabled"
      [attr.aria-posinset]="setsize !== null ? index + 1 : null"
      [attr.aria-setsize]="setsize"
      (click)="select(option)"
      (pointerenter)="onOptionHover($event, index, option.disabled)"
    >
      @if (optionTemplate(); as template) {
        <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="optionContext(option, index)" />
      } @else {
        {{ option.label }}
      }
    </button>
  </ng-template>

  @if (virtualScroll()) {
    <div
      class="tls-select__panel tls-select__panel--virtual"
      animate.enter="tls-select__panel--enter"
      animate.leave="tls-select__panel--leave"
    >
      <tls-virtual-scroll
        [items]="visibleOptions()"
        [itemSize]="virtualScrollItemSize()"
        trackBy="value"
        viewportRole="listbox"
        [viewportId]="listboxId"
        [focusable]="false"
        [style.--tls-virtual-scroll-height]="virtualPanelHeight()"
      >
        <ng-template #item let-option let-index="index" let-count="count">
          <div
            class="tls-select__option"
            role="presentation"
            [class.tls-select__option--selected]="option.value === value()"
            [class.tls-select__option--active]="index === activeIndex()"
            [class.tls-select__option--disabled]="option.disabled"
          >
            <ng-container
              [ngTemplateOutlet]="optionButton"
              [ngTemplateOutletContext]="{ $implicit: option, index: index, setsize: count }"
            />
          </div>
        </ng-template>
      </tls-virtual-scroll>
    </div>
  } @else {
    <ul
      class="tls-select__panel"
      animate.enter="tls-select__panel--enter"
      animate.leave="tls-select__panel--leave"
      role="listbox"
      [id]="listboxId"
    >
      @for (option of visibleOptions(); track option.value; let index = $index) {
        <li
          class="tls-select__option"
          [class.tls-select__option--selected]="option.value === value()"
          [class.tls-select__option--active]="index === activeIndex()"
          [class.tls-select__option--disabled]="option.disabled"
        >
          <ng-container
            [ngTemplateOutlet]="optionButton"
            [ngTemplateOutletContext]="{ $implicit: option, index: index, setsize: null }"
          />
        </li>
      }
    </ul>
  }
</ng-template>
