<button
  #trigger
  type="button"
  class="tls-select__trigger"
  role="combobox"
  [attr.id]="inputId()"
  [attr.name]="name()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  aria-haspopup="listbox"
  [attr.aria-controls]="isOpen() ? listboxId : null"
  [attr.aria-activedescendant]="activeDescendantId()"
  [tabindex]="disabled() ? -1 : tabindex()"
  [disabled]="disabled()"
  [attr.aria-expanded]="isOpen()"
  (click)="toggle()"
  (blur)="touched.set(true)"
  (keydown)="onKeydown($event)"
>
  <span class="tls-select__value" [class.tls-form-control__placeholder]="!selectedLabel()">
    {{ selectedLabel() || placeholder() }}
  </span>
  <div class="tls-select__icon" aria-hidden="true">
    <svg class="tls-select__chevron" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
</button>
@if (clearable() && hasValue()) {
  <button
    type="button"
    class="tls-select__clear"
    tabindex="-1"
    aria-label="Clear"
    (click)="clear()"
  >
    <svg class="tls-select__clear-icon" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </button>
}

<ng-template #panel>
  <ul
    class="tls-select__panel"
    animate.enter="tls-select__panel--enter"
    animate.leave="tls-select__panel--leave"
    role="listbox"
    [id]="listboxId"
  >
    @for (option of normalizedOptions(); track option.value; let index = $index) {
      <li
        class="tls-select__option"
        [class.tls-select__option--selected]="option.value === value()"
        [class.tls-select__option--active]="index === activeIndex()"
        [class.tls-select__option--disabled]="option.disabled"
      >
        <button
          class="tls-select__option-button"
          role="option"
          [id]="optionId(index)"
          [disabled]="option.disabled"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="option.disabled"
          (click)="select(option)"
          (mouseenter)="onOptionHover(index, option.disabled)"
        >{{ option.label }}
        </button>
      </li>
    }
  </ul>
</ng-template>
