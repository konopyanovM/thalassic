<div class="tls-date-picker-calendar__header">
  <button type="button" class="tls-date-picker-calendar__nav" (click)="prevMonth()">
    <tls-icon name="chevron-left" aria-hidden="true" />
  </button>
  <button type="button" class="tls-date-picker-calendar__header-button" (click)="navigateUp.emit()">
    {{ headerLabel() }}
  </button>
  <button type="button" class="tls-date-picker-calendar__nav" (click)="nextMonth()">
    <tls-icon name="chevron-right" aria-hidden="true" />
  </button>
</div>

<div class="tls-date-picker-calendar__grid">
  @for (day of displayedWeekDays(); track day) {
    <span class="tls-date-picker-calendar__weekday">{{ day }}</span>
  }
  @for (day of days(); track day.getTime()) {
    <button
      type="button"
      class="tls-date-picker-calendar__day"
      [class.tls-date-picker-calendar__day--outside]="!isInCurrentMonth(day)"
      [class.tls-date-picker-calendar__day--today]="isTodayDay(day)"
      [class.tls-date-picker-calendar__day--selected]="isSelectedDay(day)"
      [disabled]="isDisabledDay(day)"
      (click)="daySelect.emit(day)"
    >
      {{ getDayLabel(day) }}
    </button>
  }
</div>
