<div class="tls-calendar__header">
  <button type="button" class="tls-calendar__nav" (click)="prevMonth()">
    <svg viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="tls-calendar__header-button" (click)="navigateUp.emit()">
    {{ headerLabel() }}
  </button>
  <button type="button" class="tls-calendar__nav" (click)="nextMonth()">
    <svg viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="tls-calendar__grid">
  @for (day of displayedWeekDays(); track day) {
    <span class="tls-calendar__weekday">{{ day }}</span>
  }
  @for (day of days(); track day.getTime()) {
    <button
      type="button"
      class="tls-calendar__day"
      [class.tls-calendar__day--outside]="!isInCurrentMonth(day)"
      [class.tls-calendar__day--today]="isTodayDay(day)"
      [class.tls-calendar__day--selected]="isSelectedDay(day)"
      (click)="daySelect.emit(day)"
    >
      {{ getDayLabel(day) }}
    </button>
  }
</div>
