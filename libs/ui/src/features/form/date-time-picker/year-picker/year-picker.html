<div class="tls-year-picker__header">
  <button type="button" class="tls-year-picker__nav" (click)="prevPage()">
    <tls-icon name="chevron-left" aria-hidden="true" />
  </button>
  <span class="tls-year-picker__range">{{ rangeLabel() }}</span>
  <button type="button" class="tls-year-picker__nav" (click)="nextPage()">
    <tls-icon name="chevron-right" aria-hidden="true" />
  </button>
</div>
<div class="tls-year-picker__grid">
  @for (year of years(); track year) {
    <button
      type="button"
      class="tls-year-picker__cell"
      [class.tls-year-picker__cell--selected]="isSelectedYear(year)"
      [class.tls-year-picker__cell--current]="isCurrentYear(year)"
      (click)="selectYear(year)"
    >
      {{ year }}
    </button>
  }
</div>
