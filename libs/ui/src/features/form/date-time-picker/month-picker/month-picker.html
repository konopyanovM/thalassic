<div class="tls-month-picker__header">
  <button type="button" class="tls-month-picker__nav" (click)="prevYear()">
    <svg viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="tls-month-picker__header-button" (click)="navigateUp.emit()">
    {{ yearLabel() }}
  </button>
  <button type="button" class="tls-month-picker__nav" (click)="nextYear()">
    <svg viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<div class="tls-month-picker__grid">
  @for (month of months; track month) {
    <button
      type="button"
      class="tls-month-picker__cell"
      [class.tls-month-picker__cell--selected]="isSelectedMonth(month)"
      [class.tls-month-picker__cell--current]="isCurrentMonth(month)"
      (click)="selectMonth(month)"
    >
      {{ getMonthLabel(month) }}
    </button>
  }
</div>
