<tls-form-control-group [size]="size()" [fluid]="fluid()">
  <input
    [type]="type()"
    [name]="name()"
    [class]="controlClasses()"
    [attr.id]="effectiveInputId()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-labelledby]="labelledBy()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-busy]="pending() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [value]="value()"
    (input)="onInput($event)"
    (blur)="touched.set(true)"
  />
  @if (pending()) {
    <tls-loader class="tls-form-control-addon" size="xs" aria-hidden="true" />
  }
  <button
    class="tls-password-toggle tls-form-control-addon"
    type="button"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
    [attr.aria-pressed]="visible()"
    (click)="toggle()"
  >
    <span class="tls-password-toggle__item" [class.tls-password-toggle__item--hidden]="visible()">
      @if (showIconTemplate(); as icon) {
        <ng-container [ngTemplateOutlet]="icon" />
      } @else {
        <span class="text-label-md">Show</span>
      }
    </span>
    <span class="tls-password-toggle__item" [class.tls-password-toggle__item--hidden]="!visible()">
      @if (hideIconTemplate(); as icon) {
        <ng-container [ngTemplateOutlet]="icon" />
      } @else {
        <span class="text-label-md">Hide</span>
      }
    </span>
  </button>
</tls-form-control-group>
