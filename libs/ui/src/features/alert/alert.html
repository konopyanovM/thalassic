@if (!hideIcon()) {
  <ng-content select="[tlsAlertIcon]"></ng-content>

  @if (!projectedIcon()) {
    <tls-icon
      class="tls-alert__icon"
      [name]="displayIcon()"
      [iconSrc]="iconSrc()"
      aria-hidden="true"
    />
  }
}

<div class="tls-alert__body">
  @if (!hideLabel() && displayLabel()) {
    <span class="tls-alert__label">{{ displayLabel() }}</span>
  }
  <span class="tls-alert__content">
    <ng-content></ng-content>
  </span>
</div>

@if (closable()) {
  <button type="button" class="tls-alert__close" [attr.aria-label]="dismissLabel()" (click)="onClose()">
    <tls-icon class="tls-alert__close-icon" name="close" aria-hidden="true" />
  </button>
}
