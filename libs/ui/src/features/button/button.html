@if (isLink()) {
  <a
    role="link"
    [class]="classes()"
    [attr.href]="href()"
    [tabindex]="tabindex()"
    [attr.aria-disabled]="disabled()"
  >
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </a>
} @else {
  <button
    role="button"
    [class]="classes()"
    [type]="type()"
    [tabindex]="tabindex()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled()"
  >
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </button>
}

<!-- Content -->
<ng-template #contentTemplate>
  @if (label() && !icon()) {
    {{ label() }}
  } @else {
    <ng-container *ngTemplateOutlet="projectedContentTemplate"></ng-container>
  }
</ng-template>

<ng-template #projectedContentTemplate>
  <ng-content></ng-content>
</ng-template>
