@if (isLink()) {
  <a
    role="link"
    [class]="classes()"
    tlsRipple
    [attr.href]="linkHref()"
    [tabindex]="tabindex()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-labelledby]="ariaLabelledby() ?? null"
    [attr.aria-disabled]="ariaDisabled()"
    [attr.aria-busy]="busy() ? 'true' : null"
    [class.tls-button--busy]="busy()"
    (click)="onLinkClick($event)"
  >
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </a>
} @else {
  <button
    role="button"
    [class]="classes()"
    tlsRipple
    [type]="type()"
    [tabindex]="tabindex()"
    [attr.aria-label]="ariaLabel() ?? null"
    [attr.aria-labelledby]="ariaLabelledby() ?? null"
    [disabled]="disabled()"
    [attr.aria-disabled]="ariaDisabled()"
    [attr.aria-busy]="busy() ? 'true' : null"
    [class.tls-button--busy]="busy()"
    (click)="onControlClick($event)"
  >
    <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
  </button>
}

<!-- Content -->
<ng-template #contentTemplate>
  @if (label() && !icon()) {
    {{ label() }}
  } @else {
    <ng-container *ngTemplateOutlet="projectedContentTemplate"></ng-container>
  }
  @if (busy()) {
    <!-- The control itself reports aria-busy, so the spinner is only seen. -->
    <tls-loader class="tls-button__spinner" size="xs" aria-hidden="true" />
  }
</ng-template>

<ng-template #projectedContentTemplate>
  <ng-content></ng-content>
</ng-template>
