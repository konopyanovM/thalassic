@if (showFirstButton()) {
  <button
    id="tls-pagination-first"
    class="tls-pagination__button"
    [disabled]="value() === 1"
    (click)="firstPage()"
  >
    <span class="tls-pagination__button-icon">
      <tls-icon name="chevrons-left" aria-hidden="true" />
    </span>
  </button>
}

<button
  id="tls-pagination-prev"
  class="tls-pagination__button"
  [disabled]="value() === 1"
  (click)="prevPage()"
>
  <span class="tls-pagination__button-icon">
    <tls-icon name="chevron-left" aria-hidden="true" />
  </span>
</button>

<ul class="tls-pagination__list">
  @for (item of visiblePages(); track $index) {
    <li class="tls-pagination__item">
      @if (item === 'gap') {
        <span class="tls-pagination__gap">...</span>
      } @else {
        <button
          class="tls-pagination__item-button"
          [class.tls-pagination__item-button--active]="value() === item"
          (click)="setPage(item)"
        >
          {{ item }}
        </button>
      }
    </li>
  }
</ul>

<button
  id="tls-pagination-next"
  class="tls-pagination__button"
  [disabled]="value() === pageCount()"
  (click)="nextPage()"
>
  <span class="tls-pagination__button-icon">
    <tls-icon name="chevron-right" aria-hidden="true" />
  </span>
</button>

@if (showLastButton()) {
  <button
    id="tls-pagination-last"
    class="tls-pagination__button"
    [disabled]="value() === pageCount()"
    (click)="lastPage()"
  >
    <span class="tls-pagination__button-icon">
      <tls-icon name="chevrons-right" aria-hidden="true" />
    </span>
  </button>
}
