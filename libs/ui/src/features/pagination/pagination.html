@if (showFirstButton()) {
  <button
    id="tls-pagination-first"
    class="tls-pagination__button"
    [disabled]="value() === 1"
    (click)="firstPage()"
  >
    <span class="tls-pagination__button-icon">
      <svg xmlns="http://www.w3.org/2000/svg"
           width="16"
           height="16"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <polyline points="11 17 6 12 11 7" />
        <polyline points="18 17 13 12 18 7" />
      </svg>
    </span>
  </button>
}

<button
  id="tls-pagination-prev"
  class="tls-pagination__button"
  [disabled]="value() === 1"
  (click)="prevPage()"
>
  <span class="tls-pagination__button-icon">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="16"
         height="16"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </span>
</button>

<ul class="tls-pagination__list">
  @for (item of visiblePages(); track $index) {
    <li class="tls-pagination__item">
      @if (item === 'gap') {
        <span class="tls-pagination__gap">...</span>
      } @else {
        <button
          class="tls-pagination__item-button"
          [class.tls-pagination__item-button--active]="value() === item"
          (click)="setPage(item)"
        >
          {{ item }}
        </button>
      }
    </li>
  }
</ul>

<button
  id="tls-pagination-next"
  class="tls-pagination__button"
  [disabled]="value() === pageCount()"
  (click)="nextPage()"
>
  <span class="tls-pagination__button-icon">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="16"
         height="16"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </span>
</button>

@if (showLastButton()) {
  <button
    id="tls-pagination-last"
    class="tls-pagination__button"
    [disabled]="value() === pageCount()"
    (click)="lastPage()"
  >
    <span class="tls-pagination__button-icon">
      <svg xmlns="http://www.w3.org/2000/svg"
           width="16"
           height="16"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">
        <polyline points="13 17 18 12 13 7" />
        <polyline points="6 17 11 12 6 7" />
      </svg>
    </span>
  </button>
}
