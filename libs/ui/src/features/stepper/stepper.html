<ul
  class="tls-stepper-header"
  ngTabList
  [orientation]="orientation()"
  [wrap]="false"
  [softDisabled]="false"
  [selectedTab]="active()"
  (selectedTabChange)="onSelectedTabChange($event)"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
>
  @for (step of steps(); track step.value(); let index = $index; let last = $last) {
    <li role="presentation"
        class="tls-stepper-header__item"
        [class]="`tls-stepper-header--${step.color()}`"
        [class.tls-stepper-header__item--active]="ariaTab.selected()"
        [class.tls-stepper-header__item--disabled]="step.disabled()"
        [class.tls-stepper-header__item--unreachable]="linear() && index > activeIndex() + 1"
        [class.tls-stepper-header__item--completed]="activeIndex() > index || completed()">
      <button
        #ariaTab="ngTab"
        ngTab
        class="tls-stepper-header-button"
        type="button"
        [value]="step.value()"
        [disabled]="step.disabled() || (linear() && index > activeIndex() + 1)"
      >
        <span class="tls-stepper-header-button__index">
          @let isCompleted = activeIndex() > index || completed();
          @if (isCompleted && step.completedIconTemplateRef()) {
            <ng-container [ngTemplateOutlet]="step.completedIconTemplateRef() ?? null"
                          [ngTemplateOutletContext]="{ $implicit: index }"></ng-container>
          } @else if (isCompleted && completedIconTemplateRef()) {
            <ng-container [ngTemplateOutlet]="completedIconTemplateRef() ?? null"
                          [ngTemplateOutletContext]="{ $implicit: index }"></ng-container>
          } @else if (step.iconTemplateRef()) {
            <ng-container [ngTemplateOutlet]="step.iconTemplateRef() ?? null"
                          [ngTemplateOutletContext]="{ $implicit: index }"></ng-container>
          } @else {
            {{ index + 1 }}
          }
        </span>

        <span class="tls-stepper-header-button__text">
          @if (step.label()) {
            <span class="tls-stepper-header-button__label">{{ step.label() }}</span>
          }
          @if (step.description()) {
            <span class="tls-stepper-header-button__description">{{ step.description() }}</span>
          }
        </span>
      </button>
      @if (!last) {
        <div class="tls-stepper-header__divider"></div>
      }
    </li>
  }
</ul>
<div class="tls-stepper-content">
  <ng-content></ng-content>
  @if (completed() && completedTemplateRef()) {
    <div class="tls-stepper-content__template">
      <ng-container [ngTemplateOutlet]="completedTemplateRef()"></ng-container>
    </div>
  }
</div>
