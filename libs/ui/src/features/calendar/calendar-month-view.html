<div class="tls-calendar-month-view__weekdays" aria-hidden="true">
  @for (weekday of weekdayHeaders(); track weekday) {
    <span class="tls-calendar-month-view__weekday">{{ weekday }}</span>
  }
</div>

<div
  ngGrid
  class="tls-calendar-month-view__grid"
  rowWrap="nowrap"
  colWrap="nowrap"
  [attr.aria-label]="label() ?? null"
  [style.--tls-calendar-max-lanes]="maxEventsPerDay()"
>
  @for (week of weeks(); track $index) {
    <div ngGridRow class="tls-calendar-month-view__week">
      @for (cell of week.days; track cell.date.getTime()) {
        <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- ngGridCell manages role and roving tabindex -->
        <div
          ngGridCell
          class="tls-calendar-month-view__day"
          [class.tls-calendar-month-view__day--outside]="!cell.inCurrentMonth"
          [class.tls-calendar-month-view__day--today]="cell.isToday"
          (click)="dateSelect.emit(cell.date)"
          (keydown.enter)="dateSelect.emit(cell.date)"
          (keydown.space)="onDaySpace($event, cell.date)"
        >
          <span class="tls-calendar-month-view__day-number">{{ cell.dayNumber }}</span>

          @if (cell.hiddenCount > 0) {
            <span class="tls-calendar-month-view__more">+{{ cell.hiddenCount }} more</span>
          }
        </div>
      }

      <!-- Event bars span day columns and stack by lane, overlaid on the cells above. -->
      <div class="tls-calendar-month-view__bars">
        @for (bar of week.bars; track bar.event.id) {
          <tls-calendar-event
            view="month"
            class="tls-calendar-month-view__bar"
            [class.tls-calendar-month-view__bar--continues-before]="bar.continuesBefore"
            [class.tls-calendar-month-view__bar--continues-after]="bar.continuesAfter"
            [event]="bar.event"
            [template]="eventTemplate()"
            [style.grid-column]="bar.gridColumn"
            [style.grid-row]="bar.gridRow"
            (activate)="eventSelect.emit($event)"
          />
        }
      </div>
    </div>
  }
</div>
