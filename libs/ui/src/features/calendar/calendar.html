@if (showsHeader()) {
  <div class="tls-calendar__header">
    @if (showNavigation()) {
      <div class="tls-calendar__nav">
        <tls-button
          variant="text"
          size="sm"
          [ariaLabel]="labels.previous"
          class="tls-calendar__nav-button"
          (click)="previous()"
        >
          <tls-icon name="chevron-left" aria-hidden="true" />
        </tls-button>

        <tls-button variant="outlined" size="sm" [disabled]="isViewingToday()" (click)="today()">
          {{ labels.today }}
        </tls-button>

        <tls-button
          variant="text"
          size="sm"
          [ariaLabel]="labels.next"
          class="tls-calendar__nav-button"
          (click)="next()"
        >
          <tls-icon name="chevron-right" aria-hidden="true" />
        </tls-button>
      </div>
    }

    @if (showTitle()) {
      <h2 class="tls-calendar__title">{{ title() }}</h2>
    }

    @if (showsViewSwitcher()) {
      <tls-toggle-group
        class="tls-calendar__views"
        size="sm"
        [options]="viewOptions()"
        [optionLabel]="'label'"
        [optionValue]="'value'"
        [multiple]="false"
        [unselectable]="false"
        [value]="[view()]"
        (valueChange)="onViewChange($event)"
      />
    }
  </div>
}

@switch (view()) {
  @case ('month') {
    <tls-calendar-month-view
      [activeDate]="activeDate()"
      [events]="events()"
      [weekStartsOn]="weekStartsOn()"
      [weekDays]="weekDays()"
      [maxEventsPerDay]="maxEventsPerDay()"
      [squareCells]="squareCells()"
      [eventTemplate]="eventTemplate()"
      [dayTemplate]="dayTemplate()"
      [label]="ariaLabel() ?? title()"
      (dateSelect)="dateSelect.emit($event)"
      (eventSelect)="eventSelect.emit($event)"
    />
  }
  @case ('week') {
    <tls-calendar-time-grid
      view="week"
      [days]="timeGridDays()"
      [events]="events()"
      [hourStart]="hourStart()"
      [hourEnd]="hourEnd()"
      [showAllDayRow]="showAllDayRow()"
      [eventTemplate]="eventTemplate()"
      [label]="ariaLabel() ?? title()"
      (dateSelect)="dateSelect.emit($event)"
      (eventSelect)="eventSelect.emit($event)"
    />
  }
  @case ('day') {
    <tls-calendar-time-grid
      view="day"
      [days]="timeGridDays()"
      [events]="events()"
      [hourStart]="hourStart()"
      [hourEnd]="hourEnd()"
      [showAllDayRow]="showAllDayRow()"
      [eventTemplate]="eventTemplate()"
      [label]="ariaLabel() ?? title()"
      (dateSelect)="dateSelect.emit($event)"
      (eventSelect)="eventSelect.emit($event)"
    />
  }
  @case ('agenda') {
    <tls-calendar-agenda-view
      [activeDate]="activeDate()"
      [events]="events()"
      [eventTemplate]="eventTemplate()"
      [label]="ariaLabel() ?? title()"
      (dateSelect)="dateSelect.emit($event)"
      (eventSelect)="eventSelect.emit($event)"
    />
  }
}
