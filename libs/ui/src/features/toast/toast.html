<!--
  The surface is a deliberate wrapper, not a redundant one: the host element is
  the stacking layer positioned by `ToastOutlet` (transform / scale / z-index),
  while the surface is the visible card that plays the enter / leave animation —
  keeping the two transforms on separate elements so they never conflict.
-->
<div class="tls-toast__surface">
  @if (showIcon()) {
    <tls-icon class="tls-toast__icon" [name]="icon()" aria-hidden="true" />
  }

  <div class="tls-toast__body">
    @if (title(); as title) {
      <p class="tls-toast__title">{{ title }}</p>
    }
    <p class="tls-toast__message">{{ message() }}</p>
  </div>

  @if (action(); as action) {
    <tls-button
      class="tls-toast__action"
      variant="text"
      size="sm"
      [color]="color()"
      [label]="action.label"
      (click)="onAction()"
    />
  }

  @if (closable()) {
    <button type="button" class="tls-toast__close" aria-label="Dismiss" (click)="onClose()">
      <tls-icon class="tls-toast__close-icon" name="close" aria-hidden="true" />
    </button>
  }

  @if (progressVisible()) {
    <span class="tls-toast__progress" [style.--tls-toast-duration]="progressDuration()" aria-hidden="true"></span>
  }
</div>
