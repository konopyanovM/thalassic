<table
  cdk-table
  role="table"
  [class]="classes()"
  [dataSource]="dataSource"
  [trackBy]="resolvedTrackBy()"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
>
  @for (column of effectiveColumnDefinitions(); track column.key) {
    <ng-container [cdkColumnDef]="column.key">
      <!-- Header cell -->
      <th
        cdk-header-cell
        *cdkHeaderCellDef
        role="columnheader"
        class="tls-table__header-cell"
        [style.width]="column.width + 'px'"
      >
        {{ column.header }}
      </th>

      <!-- Row cell -->
      <td
        cdk-cell
        *cdkCellDef="let data; let index = index; let count = count; let first = first; let last = last; let even = even; let odd = odd"
        role="cell"
        class="tls-table__cell"
        [class.tls-table__cell--fold]="column.collapse === 'fold'"
        [class.tls-table__cell--hide]="column.collapse === 'hide'"
        [style.text-align]="column.alignment"
        [attr.data-label]="column.header ?? null"
      >
        @if (column.template) {
          <ng-container
            [ngTemplateOutlet]="column.template"
            [ngTemplateOutletContext]="{
               $implicit: cellValue(data, column.key),
               data: data,
               index: index,
               count: count,
               first: first,
               last: last,
               even: even,
               odd: odd
             }"
          />
        } @else {
          {{ cellValue(data, column.key) }}
        }
      </td>
    </ng-container>
  }

  <tr
    cdk-header-row
    *cdkHeaderRowDef="columns(); sticky: scrollable()"
    role="row"
    class="tls-table__header-row"
  ></tr>

  <tr *cdkRowDef="let row; columns: columns()" cdk-row role="row" class="tls-table__row"></tr>
</table>
