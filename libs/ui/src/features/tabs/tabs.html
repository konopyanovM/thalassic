<ul
  ngTabList
  [class]="headerClasses()"
  [orientation]="orientation()"
  [softDisabled]="false"
  [(selectedTab)]="selected"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
>
  @for (tab of tabs(); track tab) {
    <li
      role="presentation"
      class="tls-tab-header__item"
      [class.tls-tab-header__item--active]="ariaTab.selected()"
      [class.tls-tab-header__item--disabled]="tab.disabled()"
    >
      <button
        #ariaTab="ngTab"
        ngTab
        class="tls-tab-header__item-control"
        type="button"
        [value]="tab.value()"
        [disabled]="tab.disabled()"
        [attr.aria-label]="tab.headerTemplateRef() ? tab.label() : null"
      >
        @if (tab.headerTemplateRef(); as headerTemplateRef) {
          <ng-container [ngTemplateOutlet]="headerTemplateRef"></ng-container>
        } @else {
          {{ tab.label() }}
        }
      </button>
    </li>
  }
</ul>
<div class="tls-tabs-content">
  @for (tab of tabs(); track tab) {
    <div ngTabPanel class="tls-tab" [value]="tab.value()" [preserveContent]="true">
      <ng-template ngTabContent>
        <ng-container [ngTemplateOutlet]="tab.contentTemplateRef()"></ng-container>
      </ng-template>
    </div>
  }
</div>
