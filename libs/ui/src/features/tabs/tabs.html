<ul
  class="tls-tabs-header"
  ngTabList
  [orientation]="orientation()"
  [softDisabled]="false"
  [(selectedTab)]="selected"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
>
  @for (tab of tabs(); track tab) {
    <li
      role="presentation"
      class="tls-tabs-header__item"
      [class.tls-tabs-header__item--active]="ariaTab.selected()"
      [class.tls-tabs-header__item--disabled]="tab.disabled()"
    >
      <button
        #ariaTab="ngTab"
        ngTab
        class="tls-tabs-header__item-button"
        type="button"
        [value]="tab.value()"
        [disabled]="tab.disabled()"
      >
        {{ tab.label() }}
      </button>
    </li>
  }
</ul>
<div class="tls-tabs-content">
  <ng-content></ng-content>
</div>
