<ul
  class="tls-tabs-header"
  role="tablist"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-labelledby]="ariaLabelledby() ?? null"
>
  @for (tab of tabs(); track tab) {
    <li
      class="tls-tabs-header__item"
      [class.tls-tabs-header__item--active]="tab.value() === selected()"
      [class.tls-tabs-header__item--disabled]="tab.disabled()"
    >
      <button
        class="tls-tabs-header__item-button"
        role="tab"
        [disabled]="tab.disabled()"
        (click)="selected.set(tab.value())"
        [attr.aria-selected]="tab.value() === selected()"
      >
        {{ tab.label() }}
      </button>
    </li>
  }
</ul>
<div class="tls-tabs-content">
  <ng-content></ng-content>
</div>
